<style>

:root[data-theme="dark"]{--bg:#15191a;--sf:#1e2425;--tx:#e8ece9;--mu:#9aa6a0;--ac:#5fc2a5;--hl:#6b5a14;--bd:#323b3c;--ans:#1b3a33;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 10px;z-index:5}
input[type=search]{width:100%;padding:12px 14px;font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:10px}
input[type=search]:focus{outline:none;border-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
button.chip{font:inherit;font-size:.85rem;padding:5px 11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;cursor:pointer}
button.chip[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.meta{color:var(--mu);font-size:.85rem;margin:6px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.tag{color:var(--mu);font-size:.78rem;margin-bottom:4px}
.q{margin:0 0 8px}
.a{background:var(--ans);border-radius:8px;padding:8px 10px;white-space:pre-line;font-weight:600}
.a.hid{cursor:pointer;color:var(--mu);font-weight:400}
mark{background:var(--hl);color:inherit;border-radius:3px}
.empty{padding:30px 0;text-align:center;color:var(--mu)}

 scheduler）"},{"b":"行程獸原","t":"單選題","n":13,"q":"程序（Process）的哪一個部分包含用於動態記憶體分配的記憶體？ Which part of a process's memory contains memory used for dynamic memory allocation?","a":"堆積（heap）"},{"b":"行程獸原","t":"單選題","n":14,"q":"上下文切換（context switch）的時間屬於什麼？ What is the time for a context switch considered?","a":"系統的開銷（overhead for the system）"},{"b":"行程獸原","t":"單選題","n":15,"q":"在程序狀態圖中，從「就緒」狀態轉換到「執行中」狀態是由誰完成的？ In a process state diagram, what completes the transition from the \"ready\" state to the \"running\" state?","a":"排程器分派（scheduler dispatch）"},{"b":"行程獸原","t":"單選題","n":16,"q":"如果一個子程序在父程序終止後仍然存在，這會導致什麼？ What happens if a child process remains after its parent process has terminated?","a":"孤兒程序（orphan process）"},{"b":"行程獸原","t":"單選題","n":17,"q":"CPU 綁定型程序（CPU-bound process）的特徵是什麼？","a":"花費大部分時間進行計算"},{"b":"行程獸原","t":"單選題","n":18,"q":"在訊息傳遞模型中，阻塞式傳送（blocking send）意味著什麼？ In the message passing model, what does \"blocking send\" mean?","a":"傳送者被阻塞直到訊息被接收（the sender is blocked until the message is received）"},{"b":"行程獸原","t":"單選題","n":19,"q":"共享記憶體（Shared memory）通訊模型的主要問題是什麼？","a":"同步（synchronization）"},{"b":"行程獸原","t":"單選題","n":20,"q":"哪一種管道（Pipes）允許沒有親屬關係的程序之間進行通信？ Which kind of \"Pipes\" allows communication between processes without a parent-child relationship?","a":"具名管道（Named Pipes）"},{"b":"行程獸原","t":"單選題","n":21,"q":"在直接通訊（direct communication）中，鏈結是自動建立的嗎？","a":"是的，只要程序明確命名對方"},{"b":"行程獸原","t":"單選題","n":22,"q":"當一個程序完成其最後一個陳述後，他會呼叫哪個系統呼叫來請求作業系統刪除它？ After a process completes its last statement, what system call does it use to request the operating system to delete it?","a":"exit()"},{"b":"行程獸原","t":"單選題","n":23,"q":"哪一種排程器負責將程序從磁碟載入到主記憶體中，以控制多重程式化的程度？ Which scheduler controls the degree of multiprogramming?","a":"長期排程器（long-term scheduler）"},{"b":"行程獸原","t":"單選題","n":24,"q":"哪一個 UNIX 系統呼叫會創建一個新的程序？","a":"fork()"},{"b":"行程獸原","t":"複選題","n":1,"q":"以下哪些是程序的執行選項？","a":"父子程序並行執行\n父程序等待子程序終止"},{"b":"行程獸原","t":"複選題","n":2,"q":"以下哪些是遠端程序呼叫（RPC）的特點？ Which of the following are characteristics of Remote Procedure Calls (RPC)?","a":"抽象化了網路系統中的程序呼叫（abstracts procedure calls in a network system）\n使用樁（stubs）來定位伺服器並封送參數（uses stubs to locate the server and marshal\nparameters）\n使用外部資料表示法（XDR）格式處理資料（uses External Data Representation (XDR)\nformat handling）"},{"b":"行程獸原","t":"複選題","n":3,"q":"作業系統提供的用於程序操作的機制有哪些？ Which of the following are mechanisms provided by the operating system for process manipulation?","a":"程序創建（process creation）\n程序終止（process termination）"},{"b":"行程獸原","t":"複選題","n":4,"q":"哪些是訊息傳遞中的同步化類型？ Synchronisation in message passing can be...","a":"blocking (synchronous)\nnon-blocking (asynchronous)"},{"b":"行程獸原","t":"複選題","n":5,"q":"下列哪些是程序狀態？ Which of the following are process states?","a":"new\nready\nrunning\nwaiting"},{"b":"行程獸原","t":"複選題","n":6,"q":"以下哪些是普通管道（Ordinary Pipes）的特性？ Which of the following are characteristics of Ordinary Pipes?","a":"通訊是單向的（communication is unidirectional）\n需要親子關係（requires a parent-child relationship）"},{"b":"行程獸原","t":"複選題","n":7,"q":"在間接通訊（indirect communication）中，以下哪些敘述是正確的？ In indirect communication, which of the following statements are true?","a":"信箱有唯一的 ID（Each mailbox has a unique ID.）\n一個連結可能與許多程序相關聯（A single link may be associated with many programs.）\n程序只有在共享信箱時才能通訊（Programs can only communicate when sharing a\nmailbox.）"},{"b":"行程獸原","t":"複選題","n":8,"q":"以下哪些是在 IPC 中，共享記憶體和訊息傳遞模型的區別？ Which of the following are differences between shared memory and message passing models in IPC?","a":"一個是記憶體區域共享，另一個是訊息交換（One is memory area sharing, and the other is\nmessage exchange.）\n共享記憶體主要關注同步化（Shared memory primarily focuses on synchronization.）\n訊息傳遞主要關注通訊連結的建立（Message exchange primarily focuses on establishing\ncommunication connections.）"},{"b":"行程獸原","t":"複選題","n":9,"q":"以下哪些是 Chrome 瀏覽器的多程序架構中不同類型的程序？ Which of the following are different types of processes in the Chrome browser's multi- process architecture?","a":"瀏覽器程序（browser process）\n渲染程序（renderer process）\n外掛程序（plug-in process）"},{"b":"行程獸原","t":"複選題","n":10,"q":"請選出訊息傳遞的佇列有三種實作的方式 Select the three ways to implement Queue of messages attached to the link","a":"Zero capacity\nBounded capacity\nUnbounded capacity"},{"b":"行程獸原","t":"複選題","n":11,"q":"一個程序（process）包含哪些多個部分？ What are the components of a process?","a":"程式碼（text section）\n程式計數器和暫存器（program counter and registers）\n堆疊（stack）\n堆（heap）"},{"b":"行程獸原","t":"複選題","n":12,"q":"以下哪些原因可能導致父程序終止子程序？ Which of the following reasons might cause a parent process to terminate a child process?","a":"子程序超出分配的資源（the child process has exceeded allocated resources）\n分配給子程序的任務不再需要（the task assigned to the child process is no longer\nneeded）\n父程序正在退出，且作業系統不允許子程序繼續（the parent process is exiting, and the\noperating system does not allow the child process to continue）"},{"b":"行程獸原","t":"複選題","n":13,"q":"以下哪些是命名管道（Named Pipes）的特性？ Which of the following are characteristics of named pipes?","a":"雙向通訊（bidirectional）\n不需要有父程序與子程序關係（no parent-child relationship required）"},{"b":"行程獸原","t":"複選題","n":14,"q":"下列哪些是 Cooperating Process 的優點？／以下哪些是程序合作的理由？ Which of the following are reasons for process cooperation?","a":"資訊共享（information sharing）\n計算加速（computation speedup）\n模組化（modularity）\n方便性（convenience）"},{"b":"行程獸原","t":"複選題","n":15,"q":"下列哪些項目與程序控制區塊（PCB）相關？ Which of the following items are related to the Process Control Block (PCB)?","a":"程序狀態（Process State）\nCPU 暫存器（CPU Registers）\nI/O 狀態資訊（I/O Status Information）\n程式計數器（Program Counter）"},{"b":"行程獸原","t":"複選題","n":16,"q":"父程序創建子程序時，可能的資源共享選項有哪些？ What are the possible resource-sharing options when a parent process creates a child process?","a":"父子程序共享所有資源（parent and child share all resources）\n子程序共享父程序資源的子集（child process shares a subset of the parent's resources）\n父子程序不共享資源（parent and child do not share resources）"},{"b":"行程獸原","t":"複選題","n":17,"q":"哪兩種 IPC 系統是基於訊息傳遞的？ Which two types of IPC systems are based on messaging?","a":"Mach\nWindows 的 LPC（Windows's LPC）"},{"b":"行程獸原","t":"複選題","n":18,"q":"以下哪些是通訊連結的實作問題？ Which of the following are implementation issues for a communication link?","a":"如何建立連結（how to establish）\n一個連結是否可以與多個程序相關聯\n通訊連結的容量如何\n訊息的大小是固定的還是變動的"},{"b":"行程獸原","t":"複選題","n":19,"q":"哪些是程序之間通訊的兩種模型？ What are the two models of communication between processes?","a":"共享記憶體（shared memory）\n訊息傳遞（message passing）"},{"b":"行程獸原","t":"複選題","n":20,"q":"訊息傳遞設施提供的兩種操作是什麼？ What are the two operations provided by a message passing facility?","a":"發送訊息（send message）\n接收訊息（receive message）"},{"b":"行程獸原","t":"複選題","n":21,"q":"一個佇列圖可以代表什麼？ What can a queue diagram represent?","a":"佇列（a queue）\n資源（a resource）\n流程（a process）"},{"b":"行程獸原","t":"複選題","n":22,"q":"以下哪些是作業系統中的佇列？ Which of the following are queues in an operating system?","a":"作業佇列（job queue）\n就緒佇列（ready queue）\n設備佇列（device queue）"},{"b":"行程獸原","t":"複選題","n":23,"q":"以下哪些是 iOS 行動系統中的多工處理限制？","a":"僅允許一個前景程序（Only one foreground program is allowed.）\n允許多個背景程序（Multiple background programs are allowed.）"},{"b":"行程獸原","t":"填空題","n":1,"q":"一個程序在記憶體中被組織成多個部分，其中_____包含暫時性資料，如函式參數、回傳位址和 區域變數。(請用英文縮寫回答 且用大寫字母) A program is organized in memory into several parts, _____ of which contain temporary data such as function parameters, return addresses, and local variables.","a":"PCB"},{"b":"行程獸原","t":"填空題","n":2,"q":"一個花費大部分時間進行計算的程序被稱為_____程序。(請用小寫英文回答 單字間留一個空白) A process that spends most of its time computing is called a _____ process.","a":"cpu bound"},{"b":"行程獸原","t":"填空題","n":3,"q":"_____抽象化了網路系統中程序之間的程序呼叫。(請用英文小寫回答，單字間留一空白)","a":"remote procedure call"},{"b":"行程獸原","t":"填空題","n":4,"q":"在 Windows 的 IPC 系統中，通訊是透過進階的_____設施進行的。(請用英文縮寫回答 且用大 寫字母) In Windows IPC systems, communication is conducted through advanced _____ facilities.","a":"LPC"},{"b":"行程獸原","t":"填空題","n":5,"q":"過程控制區塊 (PCB) 包含與每個過程相關的訊息，也稱為 _____ (請用小寫英文回答，單字間留 空白) The process control block (PCB) contains information associated with each process, also known as the _____","a":"process control block"},{"b":"行程獸原","t":"填空題","n":6,"q":"連結上沒有訊息排隊。發送方必須等待接收方的這種無空間的緩衝方式叫做_____。(請用小寫英 文回答) For a message queue, no messages are queued on a link; sender must wait for receiver. This is called _____","a":"rendezvous"},{"b":"行程獸原","t":"填空題","n":7,"q":"程序的五種狀態是：新建立（new）、執行中（running）、等待中（waiting）、就緒 （ready）和_____。(請用小寫英文回答) The five states of a process are: new, running, waiting, ready, and _____","a":"terminated"},{"b":"行程獸原","t":"填空題","n":8,"q":"在 UNIX 系統中，_____系統呼叫在 fork() 之後使用，用來將程序的記憶體空間替換為一個新程 式。(請用英文小寫回答) In UNIX systems, the _____ system call is used after fork() to replace the process's memory space with a new program.","a":"exec()"},{"b":"行程獸原","t":"填空題","n":9,"q":"在共享記憶體通訊中，主要的問題是為用戶程序提供一個機制，使其在存取共享記憶體時能夠 _____其動作。(請用小寫英文回答) In shared-memory communication, the main issue is to provide a mechanism for user processes to _____ their actions when accessing shared memory.","a":"synchronize"},{"b":"行程獸原","t":"填空題","n":10,"q":"_____充當一個通道允許兩個程序通訊。(請用小寫英文回答) A _____ acts as a conduit that allows two processes to communicate.","a":"pipe"},{"b":"行程獸原","t":"填空題","n":11,"q":"如果父程序不呼叫 wait()，則終止的子程序會變成 _____ 程序。(請用小寫英文回答) If a parent process does not call wait(), a terminated child process becomes a _____ process.","a":"zombie"},{"b":"行程獸原","t":"填空題","n":12,"q":"訊息傳遞中的同步化可以是_____或 non-blocking synchronous。(請用小寫英文回答，單字 間留一空白) Synchronization in message transmission can be _____ or non-blocking synchronous.","a":"blocking synchronous"},{"b":"行程獸原","t":"填空題","n":13,"q":"在 Mach IPC 系統中，訊息傳遞系統呼叫包含 msg_send()、msg_receive() 和 _____。(請用小 寫英文作答) In the Mach IPC system, the message passing system calls include msg_send(), msg_receive(), and _____.","a":"msg_rpc()"},{"b":"行程獸原","t":"填空題","n":14,"q":"普通管道(ordinary pipe)是_____的，並且要求通訊程序之間有親子關係。(請用小寫英文回答) Ordinary pipes are _____ and require a parent-child relationship between communicating processes.","a":"unidirectional"},{"b":"行程獸原","t":"填空題","n":15,"q":"具名管道(named pipe)比普通管道(ordinary pipe)更強大，因為其通訊是_____的，且不需要 親子關係。 Named pipes are more powerful than ordinary pipes because their communication is _____ and does not require parent-child relationships.","a":"bidirectional"},{"b":"行程獸原","t":"填空題","n":16,"q":"在遠端程序呼叫 (RPC) 中，_____是伺服器上實際程序的客戶端代理。 In remote procedure calls (RPC), _____ are the client proxy of the actual procedure on the server.","a":"stubs"},{"b":"行程獸原","t":"填空題","n":17,"q":"iOS 行動系統提供一個單一的_____程序，通過用戶介面進行控制。 The iOS mobile system provides a single _____ process that is controlled through a user interface.","a":"foreground"},{"b":"行程獸原","t":"填空題","n":18,"q":"CPU 在程序之間切換時，必須儲存舊程序的狀態並載入新程序的儲存狀態，這被稱為_____。 When the CPU switches between processes, it must save the state of the old process and load the saved state of the new process, a procedure known as a _____.","a":"context switch"},{"b":"行程獸原","t":"填空題","n":19,"q":"一個_____被定義為通訊的端點，由 IP 位址和連接埠的組合而成。 A(n) _____ is defined as a communication endpoint, consisting of a combination of an IP address and a port.","a":"socket"},{"b":"行程獸原","t":"填空題","n":20,"q":"長期排程器控制_____的程度，該名詞指的是在記憶體中同時存在的程序數量。 The long-term scheduler controls the degree of _____, which refers to the number of processes existing in memory at the same time.","a":"Multiprogramming"},{"b":"行程獸原","t":"填空題","n":21,"q":"中期排程器可以將一個程序從記憶體中移除並存儲到磁碟上，然後再將其帶回，這個過程稱為 _____。 A mid-term scheduler can remove a process from memory and store it on a disk, and then bring it back; this process is called _____.","a":"swapping"},{"b":"行程獸原","t":"填空題","n":22,"q":"如果一個子程序在父程序終止後仍然存在,且父程序未呼叫 wait(),這會導致該子程序成為一個 _____程序。 If a parent process does not call wait(), a terminated child process becomes a _____process.","a":"orphan"},{"b":"行程獸原","t":"填空題","n":23,"q":"_____問題是合作程序的一種範式，其中一個程序產生資訊，而另一個程序消耗該資訊。(請用小 寫英文回答，單字間用 - 連接) The _____ problem is a paradigm for cooperating processes, in which one process produces information and another process consumes that information.","a":"producer-consumer"},{"b":"執行緒山","t":"單選題","n":1,"q":"執行緒取消（Thread Cancellation）的兩種方法中，哪一種會立即終止目標執行緒？ Of the two methods of thread cancellation, which one immediately terminates the target thread?","a":"異步取消 (Asynchronous cancellation)"},{"b":"執行緒山","t":"單選題","n":2,"q":"下列哪一個不是主要的使用者層級執行緒函式庫？ Which of the following is not a major user-level thread library?","a":"Android threads"},{"b":"執行緒山","t":"單選題","n":3,"q":"Java 執行緒通常由誰管理？ Who typically manages Java threads?","a":"Java 虛擬機 (JVM) / Java Virtual Machine (JVM)"},{"b":"執行緒山","t":"單選題","n":4,"q":"在 Windows 系統中，每個執行緒的「上下文 (context)」不包含下列哪一項？ In the Windows system, which of the following is not included in each thread's \"context\"?","a":"其他程序執行緒的 ID（IDs of other process threads）"},{"b":"執行緒山","t":"單選題","n":5,"q":"在多核心程式設計中，將相同資料集的子集分配到多個核心上，並在每個核心上執行相同操 作，是哪一種類型的平行處理？ In multicore programming, what type of parallelism involves distributing subsets of the same data across multiple cores and performing the same operation on each core?","a":"資料平行 (Data parallelism)"},{"b":"執行緒山","t":"單選題","n":6,"q":"多執行緒伺服器架構中，當一個客戶端請求到達時，伺服器會做什麼？ In a multithreaded server architecture, what does the server do when a client request arrives?","a":"創建一個新執行緒來服務請求 (Create a new thread to service the request)"},{"b":"執行緒山","t":"單選題","n":7,"q":"哪一種多執行緒模型將多個使用者層級執行緒映射到單一核心執行緒？ Which multithreading model maps multiple user-level threads to a single kernel thread?","a":"Many-to-One"},{"b":"執行緒山","t":"單選題","n":8,"q":"POSIX Pthreads 是什麼？ What is POSIX Pthreads?","a":"一個用於執行緒創建和同步的 API 標準 (An API standard for thread creation and\nsynchronization)"},{"b":"執行緒山","t":"單選題","n":9,"q":"下列哪一個作業系統的執行緒實作採用 One-to-One 模型？ Which of the following operating systems implements the One-to-One model for threads?","a":"Windows NT/XP/2000"},{"b":"執行緒山","t":"單選題","n":10,"q":"多執行緒程式設計的好處中，下列哪一項與使用者介面特別相關？ Among the benefits of multithreaded programming, which one is particularly relevant to user interfaces?","a":"響應性 (Responsiveness)"},{"b":"執行緒山","t":"單選題","n":11,"q":"執行緒 (Thread) 與程序 (Process) 相比，其創建成本有何不同？ How does the creation cost of a thread compare to that of a process?","a":"執行緒創建是輕量級的 (Thread creation is lightweight)"},{"b":"執行緒山","t":"單選題","n":12,"q":"執行緒本地儲存 (Thread-local storage, TLS) 有何用途？ What is the purpose of Thread-local storage (TLS)?","a":"允許每個執行緒擁有自己的資料副本 (Allows each thread to have its own copy of data)"},{"b":"執行緒山","t":"單選題","n":13,"q":"下列何者是多執行緒程式設計的一個優點？ Which of the following is an advantage of multithreaded programming?","a":"簡化程式碼並提高效率 (Simplifies code and improves efficiency)"},{"b":"執行緒山","t":"單選題","n":14,"q":"使用者層級執行緒 (User-level threads) 的管理主要由誰負責？ Who is primarily responsible for managing user-level threads?","a":"使用者層級執行緒函式庫 (User-level thread library)"},{"b":"執行緒山","t":"單選題","n":15,"q":"哪一種多執行緒模型為每個使用者層級執行緒映射一個核心執行緒？ Which multithreading model maps one kernel thread for each user-level thread?","a":"One-to-One"},{"b":"執行緒山","t":"單選題","n":16,"q":"Amdahl's Law 主要用來識別什麼樣的效能提升？ What kind of performance gain is Amdahl's Law primarily used to identify?","a":"增加額外核心所帶來的效能提升 (Performance gain from adding extra cores)"},{"b":"執行緒山","t":"單選題","n":17,"q":"OpenMP 主要提供在哪種環境下進行平行程式設計的支援？ In what environment does OpenMP primarily provide support for parallel programming?","a":"共享記憶體環境 (Shared-memory environment)"},{"b":"執行緒山","t":"單選題","n":18,"q":"Linux 創建執行緒的系統呼叫是什麼？ What is the Linux system call for creating a thread?","a":"clone()"},{"b":"執行緒山","t":"單選題","n":19,"q":"下列哪一個不是隱式執行緒 (Implicit Threading) 的方法？ Which of the following is not a method of implicit threading?","a":"pthread_create()"},{"b":"執行緒山","t":"單選題","n":20,"q":"在多處理器架構中，利用多個處理器核心的優點是什麼？ In a multiprocessor architecture, what is the advantage of utilizing multiple processor cores?","a":"可擴展性 (Scalability)"},{"b":"執行緒山","t":"單選題","n":21,"q":"Grand Central Dispatch 是由哪家公司開發的技術？ Which company developed the Grand Central Dispatch technology?","a":"Apple"},{"b":"執行緒山","t":"複選題","n":1,"q":"在多核心系統中進行程式設計時，可能遇到的挑戰包括？ What are some of the challenges you might encounter when programming for multicore systems?","a":"分割活動 (Dividing activities)\n測試與除錯 (Testing and debugging)\n資料相依性 (Data dependency)"},{"b":"執行緒山","t":"複選題","n":2,"q":"在 Windows 執行緒的資料結構中，使用者空間（user space）包含哪些區塊？ In the Windows thread data structure, what blocks are contained in user space?","a":"TEB\n執行緒本地儲存 (Thread-local storage)"},{"b":"執行緒山","t":"複選題","n":3,"q":"在 Windows 執行緒的資料結構中，核心空間（kernel space）包含哪些區塊？ In the Windows thread data structure, what blocks are contained in kernel space?","a":"ETHREAD\nKTHREAD"},{"b":"執行緒山","t":"複選題","n":4,"q":"單執行緒程序和多執行緒程序共享哪些資源？ What resources are shared by single-threaded processes and multithreaded processes?","a":"程式碼 (Program code)\n資料 (Data)\n檔案 (Files)"},{"b":"執行緒山","t":"複選題","n":5,"q":"執行緒池（Thread Pools）的優點包括哪些？ What are the advantages of Thread Pools?","a":"使用現有執行緒服務請求比創建新執行緒更快\n允許應用程式中的執行緒數量被限制在池的大小\n將任務與創建任務的機制分離\nUsing existing threads to service requests is faster than creating new threads\nAllows the number of threads in the application to be limited to the size of the pool\nSeparates the task from the mechanism that creates the task"},{"b":"執行緒山","t":"複選題","n":6,"q":"哪一種多執行緒模型允許一個核心執行緒與一個使用者執行緒綁定？ Which multithreading model allows binding a user thread to a kernel thread?","a":"Many-to-One\nOne-to-One\nMany-to-Many\nTwo-level"},{"b":"執行緒山","t":"複選題","n":7,"q":"多執行緒伺服器架構的優點包含哪些？ What are the advantages of a multithreaded server architecture?","a":"伺服器可以同時服務多個客戶端請求\n當一個執行緒被阻塞時，其他執行緒可以繼續執行\n執行緒創建比程序創建更輕量級\nThe server can service multiple client requests simultaneously\nWhen one thread is blocked, other threads can continue to run\nThread creation is more lightweight than process creation"},{"b":"執行緒山","t":"複選題","n":8,"q":"在 Linux 系統中，關於執行緒的敘述哪些是正確的？ Which of the following statements about threads in the Linux system are correct?","a":"Linux 將執行緒稱為任務\n執行緒創建是透過 clone() 系統呼叫完成\nclone() 允許子任務與父任務共享位址空間\nLinux refers to threads as tasks\nThread creation is done via the clone() system call\nclone() allows child tasks to share the parent's address space"},{"b":"執行緒山","t":"複選題","n":9,"q":"延遲取消（Deferred cancellation）有何特性？ What are the characteristics of deferred cancellation?","a":"允許目標執行緒定期檢查是否應被取消\n只有當執行緒到達取消點時才會發生取消\n屬於 Pthread 的預設取消類型"},{"b":"執行緒山","t":"複選題","n":10,"q":"隱式執行緒（Implicit Threading）的優勢在於？ What are the advantages of Implicit Threading?","a":"減少程式設計師管理執行緒的負擔\n創建和管理執行緒由編譯器和執行時期函式庫完成\n有助於解決執行緒數量增加時的程式正確性問題"},{"b":"執行緒山","t":"複選題","n":11,"q":"在 Java 中，創建執行緒的方法有哪兩種？ In Java, what are the two methods for creating a thread?","a":"繼承 Thread 類別 (Inheriting the Thread class)\n實作 Runnable 介面 (Implementing the Runnable interface)"},{"b":"執行緒山","t":"複選題","n":12,"q":"OpenMP 提供哪些特性來支援平行程式設計？ What characteristics does OpenMP provide to support parallel programming?","a":"一組編譯器指令和 API\n在共享記憶體環境中支援平行程式設計\n允許程式設計師明確標識平行區域\nA set of compiler directives and APIs\nSupports parallel programming in a shared-memory environment\nAllows programmers to explicitly identify parallel regions"},{"b":"執行緒山","t":"複選題","n":13,"q":"執行緒本地儲存（Thread-local storage, TLS）與區域變數有何不同？ How does Thread-local storage (TLS) differ from local variables?","a":"TLS 在多次函式呼叫中可見\n區域變數只在單次函式呼叫中可見"},{"b":"執行緒山","t":"複選題","n":14,"q":"多執行緒程式設計的好處包含哪些？ What are the benefits of multithreaded programming?","a":"響應性 (Responsiveness)\n資源共享 (Resource sharing)\n經濟性 (Economy)\n可擴展性 (Scalability)"},{"b":"執行緒山","t":"複選題","n":15,"q":"下列關於平行性與並行性的敘述，哪些是正確的？ Which of the following statements about Parallelism and Concurrency are correct?","a":"平行性意指一個系統可以同時執行多個任務\n並行性意指一個系統可以支援多個任務同時進展\n單核心系統可以提供並行性\n多核心系統可以提供平行性\nParallelism means a system can execute more than one task simultaneously\nConcurrency means a system can support the progression of more than one task at\nthe same time\nA single-core system can provide concurrency\nA multicore system can provide parallelism"},{"b":"執行緒山","t":"複選題","n":16,"q":"下列哪些作業系統採用 One-to-One 模型？ Which of the following operating systems use the One-to-One model?","a":"Windows NT/XP/2000\nLinux\nSolaris 9 和更高版本 (Solaris 9 and higher)"},{"b":"執行緒山","t":"複選題","n":17,"q":"下列關於 fork() 和 exec() 系統呼叫在多執行緒環境下的語義描述，哪些是正確的？ Which of the following statements describing the semantics of fork() and exec() system calls in a multithreaded environment are correct?","a":"fork() 有時只複製呼叫執行緒\nfork() 有時會複製所有執行緒\nexec() 通常會替換整個正在運行的程序，包括所有執行緒"},{"b":"執行緒山","t":"複選題","n":18,"q":"One-to-One 模型有何特性？ What are the characteristics of the One-to-One model?","a":"每個使用者層級執行緒映射到一個核心執行緒\n創建使用者層級執行緒會創建一個核心執行緒\n比 Many-to-One 模型提供更多的並行性\n程序中執行緒數量有時會因為開銷而受限\nEach user-level thread maps to one kernel thread\nCreating a user-level thread creates a kernel thread\nProvides more concurrency than the Many-to-One model\nThe number of threads in a process can sometimes be limited by overhead"},{"b":"執行緒山","t":"複選題","n":19,"q":"Many-to-One 模型具有哪些特性？ What are the characteristics of the Many-to-One model?","a":"多個使用者層級執行緒映射到單一核心執行緒\n一個執行緒被阻塞會導致所有執行緒被阻塞\n多個執行緒無法在多核心系統上平行運行\nMultiple user-level threads are mapped to a single kernel thread\nThe blocking of one thread blocks all threads\nMultiple threads cannot run in parallel on a multicore system"},{"b":"執行緒山","t":"複選題","n":20,"q":"下列哪些屬於使用者層級執行緒函式庫？ Which of the following are user-level thread libraries?","a":"POSIX Pthreads\nWin32 threads\nJava threads"},{"b":"執行緒山","t":"複選題","n":21,"q":"在多執行緒環境中，處理信號的方式可以有哪幾種？ What are the ways to handle signals in a multithreaded environment?","a":"將信號傳遞給應用該信號的特定執行緒\n將信號傳遞給程序中的每個執行緒\n將信號傳遞給程序中的某些特定執行緒\n指定一個特定執行緒來接收所有信號"},{"b":"執行緒山","t":"填空題","n":1,"q":"_____指將相同資料集的子集分配到多個核心上，並在每個核心上執行相同的操作。 _____ refers to the distribution of subsets of the same data set to multiple cores, with the same operation being performed on each core","a":"data parallelism"},{"b":"執行緒山","t":"填空題","n":2,"q":"_____指將執行緒分配到不同的核心上，每個執行緒執行獨特的任務。 _____ refers to the distribution of threads to different cores, with each thread executing a unique task","a":"task parallelism"},{"b":"執行緒山","t":"填空題","n":3,"q":"_____技術的流行，是因為當執行緒數量增加時，程式的正確性變得更難以確保。 The popularity of _____ techniques is due to the difficulty of ensuring program correctness as the number of threads increases","a":"implicit threading"},{"b":"執行緒山","t":"填空題","n":4,"q":"在 _____ 模型中，多個使用者層級執行緒映射到單一核心執行緒。 In the _____ model, many user-level threads are mapped to a single kernel thread","a":"many-to-one"},{"b":"執行緒山","t":"填空題","n":5,"q":"在 _____ 模型中，許多使用者層級執行緒可以被映射到許多核心執行緒。 In the _____ model, many user-level threads can be mapped to many kernel threads","a":"many-to-many"},{"b":"執行緒山","t":"填空題","n":6,"q":"在 _____ 模型中，每個使用者層級執行緒映射到一個核心執行緒。 In the _____ model, each user-level thread is mapped to one kernel thread","a":"one-to-one"},{"b":"執行緒山","t":"填空題","n":7,"q":"Windows 執行緒實作了 _____ 模型。 Windows threads implement the _____ model","a":"one-to-one"},{"b":"執行緒山","t":"填空題","n":8,"q":"由於執行緒共用程序的資源，因此 _____ 比共享記憶體或訊息傳遞更容易實現。 Because threads share a process's resources, _____ is easier to achieve than shared memory or message passing","a":"resource sharing"},{"b":"執行緒山","t":"填空題","n":9,"q":"多執行緒應用程式的優點之一是 _____，因為即使程序的一部分被阻塞，程式碼也能繼續執行。 One of the advantages of multithreaded applications is _____, as code can continue to run even if part of the process is blocked","a":"responsiveness"},{"b":"執行緒山","t":"填空題","n":10,"q":"_____是指一個系統可以同時執行一個以上的任務。 _____ refers to a system's ability to execute more than one task simultaneously","a":"parallelism"},{"b":"執行緒山","t":"填空題","n":11,"q":"_____是指一個系統可以支援一個以上的任務同時取得進展。 _____ means a system can support the progression of more than one task at the same time","a":"concurrency"},{"b":"執行緒山","t":"填空題","n":12,"q":"有三種主要的使用者層級執行緒函式庫：POSIX Pthreads、Win32 threads 和 _____。 There are three major user-level thread libraries: POSIX Pthreads, Win32 threads, and _____","a":"java threads"},{"b":"執行緒山","t":"填空題","n":13,"q":"Amdahl's Law 的公式為：speedup <= 1/(S+(1-S)/N)，其中 S 代表應用程式的 _____ 部分。 Amdahl's Law is formulated as: speedup = 1/(S+(1-S)/N), where S represents the _____ of the application","a":"serial portion"},{"b":"執行緒山","t":"填空題","n":14,"q":"Amdahl's Law 的公式為：speedup <= 1/(S+(1-S)/N)，N 代表 _____ 的數量。 Amdahl's Law is formulated as: speedup = 1/(S+(1-S)/N), where N represents the number of _____","a":"processing cores"},{"b":"執行緒山","t":"填空題","n":15,"q":"_____是一種終止執行緒的方法，它允許目標執行緒定期檢查是否應被取消。 _____ is a method for terminating a thread that allows the target thread to periodically check whether it should be canceled","a":"deferred cancellation"},{"b":"執行緒山","t":"填空題","n":16,"q":"_____是 CPU 利用率的基本單位，也是多執行緒電腦系統的基礎。 _____ is the basic unit of CPU utilization and the foundation of multithreaded computer systems","a":"thread"},{"b":"執行緒山","t":"填空題","n":17,"q":"_____允許每個執行緒擁有自己的資料副本。 _____ allows each thread to have its own copy of data","a":"thread local storage"},{"b":"執行緒山","t":"填空題","n":18,"q":"_____是一個 Apple 的技術，用於 Mac OS X 和 iOS 作業系統，允許識別平行區域並管理執行 緒的細節。 _____ is an Apple technology used in the Mac OS X and iOS operating systems that allows for the identification of parallel regions and management of thread details","a":"grand central dispatch"},{"b":"執行緒山","t":"填空題","n":19,"q":"_____用於在 UNIX 系統中通知程序發生特定事件。 _____ are used in UNIX systems to notify a process that a specific event has occurred","a":"signals"},{"b":"執行緒山","t":"填空題","n":20,"q":"創建執行緒的成本比程序 (process) 少，且執行緒切換的開銷也低於 _____。 The cost of creating a thread is less than a process, and the overhead of a thread switch is also lower than a _____","a":"context switch"},{"b":"執行緒山","t":"填空題","n":21,"q":"在 _____ 模型中，會創建一定數量的執行緒，並將其放置在池中等待工作。 In the _____ model, a number of threads are created and placed into a pool where they wait for work","a":"thread pools"},{"b":"行程排程谷","t":"單選題","n":1,"q":"短剩餘時間優先（SRTF）是哪一種排程演算法的搶佔式版本？ Shortest-remaining-time-first (SRTF) is the preemptive version of which scheduling algorithm?","a":"短工作優先（SJF） Shortest-Job-First (SJF)"},{"b":"行程排程谷","t":"單選題","n":2,"q":"在多處理器系統中，哪種方法僅有一個處理器負責存取系統資料結構？ In a multiprocessor system, which approach involves only one processor accessing the system data structures?","a":"非對稱多處理 Asymmetric multiprocessing"},{"b":"行程排程谷","t":"單選題","n":3,"q":"哪一個排程演算法會導致「護航效應」（convoy effect）？ Which scheduling algorithm can lead to the 'convoy effect'?","a":"先到先服務（FCFS） First-Come, First-Served (FCFS)"},{"b":"行程排程谷","t":"單選題","n":4,"q":"在 Linux 核心版本 2.6.23 之後，主要的排程器演算法是什麼？ After Linux kernel version 2.6.23, what is the main scheduling algorithm?","a":"完全公平排程器（CFS） Completely Fair Scheduler (CFS)"},{"b":"行程排程谷","t":"單選題","n":5,"q":"在優先權排程中，什麼問題可能導致低優先權程序永遠無法執行？ In priority scheduling, what problem can cause low-priority processes to never execute?","a":"飢餓（Starvation） Starvation"},{"b":"行程排程谷","t":"單選題","n":6,"q":"從中斷到達的時間到服務該中斷的函式(ISR)開始執行的時間，這段時間被稱為？ The time from the arrival of an interrupt to the start of the routine that services the interrupt is called?","a":"中斷延遲 Interrupt latency"},{"b":"行程排程谷","t":"單選題","n":7,"q":"在 Windows 排程中，哪個功能允許應用程式獨立於核心來創建和管理執行緒？ In Windows scheduling, what feature allows applications to create and manage threads independently of the kernel?","a":"使用者模式排程（UMS） User-mode scheduling (UMS)"},{"b":"行程排程谷","t":"單選題","n":8,"q":"在 Solaris 作業系統中，預設的排程類別是什麼？ In the Solaris operating system, what is the default scheduling class?","a":"時程共享（Time Sharing） Time Sharing"},{"b":"行程排程谷","t":"單選題","n":9,"q":"什麼是 Little's Formula (n = λ x W) 中的 n？ In Little's Formula (n = λ x W), what does n represent?","a":"平均佇列長度 Average queue length"},{"b":"行程排程谷","t":"單選題","n":10,"q":"哪一個排程演算法被認為是最佳的，因為它能提供給定程序集的最小平均等待時間？ Which scheduling algorithm is considered optimal because it provides the minimum average waiting time for a given set of processes?","a":"短工作優先（SJF） Shortest-Job-First (SJF)"},{"b":"行程排程谷","t":"單選題","n":11,"q":"在 POSIX 即時排程中，SCHED_FIFO 的特點是什麼？ What is a characteristic of SCHED_FIFO in POSIX real-time scheduling?","a":"沒有時間分片 / There is no time-slicing"},{"b":"行程排程谷","t":"單選題","n":12,"q":"在 Windows 排程中，哪個優先權類別的程序不能被提升優先權？ In Windows scheduling, which priority class of processes cannot have its priority boosted?","a":"REALTIME_PRIORITY_CLASS"},{"b":"行程排程谷","t":"單選題","n":13,"q":"迴圈排程（RR）演算法中，每個程序獲得一小段 CPU 時間的單位稱為？ In the Round Robin (RR) scheduling algorithm, what is the unit of a small amount of CPU time given to each process?","a":"時間片（Time quantum） / Time quantum"},{"b":"行程排程谷","t":"單選題","n":14,"q":"當迴圈排程（RR）中的時間片（q）非常大時，該演算法的行為會趨近於哪種排程？ When the time quantum (q) in Round Robin (RR) is very large, the algorithm's behavior approaches which scheduling type?","a":"先到先服務（FCFS） / First-Come, First-Served (FCFS)"},{"b":"行程排程谷","t":"單選題","n":15,"q":"CPU 排程的核心目標是什麼？ What is the core objective of CPU scheduling?","a":"最大化 CPU 利用率 / Maximize CPU utilization"},{"b":"行程排程谷","t":"單選題","n":16,"q":"在多層級回饋佇列（Multilevel Feedback Queue）排程中，老化（aging）是如何實現的？ How is aging implemented in Multilevel Feedback Queue scheduling?","a":"通過讓程序在佇列之間移動 / By allowing a process to move between queues"},{"b":"行程排程谷","t":"單選題","n":17,"q":"在 Windows 系統中，當一個執行緒的時限（quantum）用完後，它的優先權會如何？ In the Windows system, what happens to a thread's priority when its quantum expires?","a":"降低 / It is lowered"},{"b":"行程排程谷","t":"單選題","n":18,"q":"硬即時系統（Hard real-time systems）的重要特性是什麼？ What is a key characteristic of hard real-time systems?","a":"任務必須在截止時間內完成 / A task must be serviced by its deadline"},{"b":"行程排程谷","t":"單選題","n":19,"q":"在多核心處理器中，利用記憶體停頓時間來推進另一個執行緒的技術是什麼？ In multicore processors, what technique takes advantage of memory stall to make progress on another thread?","a":"多執行緒多核心系統 / Multithreaded multicore system"},{"b":"行程排程谷","t":"單選題","n":20,"q":"下列哪一項是分派器（Dispatcher）的工作？ Which of the following is a task of the Dispatcher?","a":"將 CPU 控制權交給排程器選擇的程序 Giving control of the CPU to the process\nselected by the scheduler"},{"b":"行程排程谷","t":"單選題","n":21,"q":"分派延遲（Dispatch latency）指的是什麼？ What is Dispatch latency?","a":"將一個程序停止並啟動另一個程序所需的時間 / The time it takes to stop one process\nand start another running"},{"b":"行程排程谷","t":"單選題","n":22,"q":"在排程演算法評估中，什麼方法使用預先確定的工作負載來評估每個演算法的性能？ In scheduling algorithm evaluation, what method uses a predetermined workload to define the performance of each algorithm?","a":"確定性建模 / Deterministic modeling"},{"b":"行程排程谷","t":"單選題","n":23,"q":"在每個處理器皆自行排程的對稱多處理（SMP）系統中，這種排程方式屬於？ In a symmetric multiprocessing (SMP) system where each processor is self- scheduling, what is this scheduling method?","a":"以上答案皆非 / None of answer"},{"b":"行程排程谷","t":"單選題","n":24,"q":"在多層級佇列（Multilevel Queue）排程中，下列哪一項敘述是正確的？ In Multilevel Queue scheduling, which statement is correct?","a":"前景佇列通常使用迴圈排程 / Foreground queue usually uses Round Robin"},{"b":"行程排程谷","t":"單選題","n":25,"q":"在 POSIX 即時排程中，哪種排程策略與 SCHED_FIFO 相似，但對相同優先權的執行緒有時間 分片？ In POSIX real-time scheduling, which scheduling policy is similar to SCHED_FIFO but includes time-slicing for threads of equal priority?","a":"SCHED_RR"},{"b":"行程排程谷","t":"單選題","n":26,"q":"CPU 排程器是哪一種類型的排程器？ What type of scheduler is the CPU scheduler?","a":"短程排程器 / Short-term scheduler"},{"b":"行程排程谷","t":"單選題","n":27,"q":"衡量排程演算法的吞吐量（Throughput）是指什麼？ What is throughput as a measure of a scheduling algorithm?","a":"每單位時間完成執行的程序數量 / The number of processes that complete their\nexecution per time unit"},{"b":"行程排程谷","t":"單選題","n":28,"q":"當一個程序從「執行中」狀態切換到「等待中」狀態時，排程決策屬於哪種類型？ When a process switches from a 'running' to a 'waiting' state, what type of scheduling decision is it?","a":"非搶佔式 / Nonpreemptive"},{"b":"行程排程谷","t":"單選題","n":29,"q":"在優先權排程中，解決「飢餓」問題的方法是什麼？ In priority scheduling, what is the solution to the problem of 'starvation'?","a":"老化（Aging） / Aging"},{"b":"行程排程谷","t":"單選題","n":30,"q":"在 CPU-I/O 週期中，程式的執行由什麼組成？ In a CPU-I/O cycle, what does process execution consist of?","a":"CPU 爆發和 I/O 爆發的交替 / An alternating cycle of CPU bursts and I/O bursts"},{"b":"行程排程谷","t":"複選題","n":1,"q":"下列哪些排程決策屬於非搶佔式？ Which of the following scheduling decisions are nonpreemptive?","a":"程序從執行中狀態切換到等待中狀態 / A process switches from the running to the waiting\nstate\n行程終止 / A process terminates"},{"b":"行程排程谷","t":"複選題","n":2,"q":"Linux 在核心版本 2.5 中採用的 O(1) 排程器有哪些特性？ What are the characteristics of the O(1) scheduler adopted by Linux in kernel version 2.5?","a":"搶佔式\n基於優先權\n有兩個優先權範圍：時程共享和即時\nPreemptive\nPriority-based\nIt has two priority ranges: time-sharing and real-time"},{"b":"行程排程谷","t":"複選題","n":3,"q":"關於估計下一個 CPU 爆發長度，可以採用哪些方法？ What methods can be used to estimate the length of the next CPU burst?","a":"使用過去 CPU 爆發長度的指數平均\n詢問使用者\n設定 α=1 表示只考慮最後一個\nExponential averaging of past CPU bursts\nAsk the user\nburst / Set α=1 to consider only the last burst"},{"b":"行程排程谷","t":"複選題","n":4,"q":"完全公平排程器（CFS）有哪些特性？ What are the characteristics of the Completely Fair Scheduler (CFS)?","a":"優先權基於 nice 值\n維護一個每任務的虛擬運行時間（vruntime）\n選擇虛擬運行時間最短的任務運行\nPriority is based on the nice value\nIt maintains a per-task virtual run time (vruntime)\nIt selects the task with the lowest virtual run time to run"},{"b":"行程排程谷","t":"複選題","n":5,"q":"迴圈排程（RR）的性能與哪些因素相關？ What factors affect the performance of Round Robin (RR) scheduling?","a":"時間片（q）的大小\n上下文切換（context switch）的時間\n程序在就緒佇列中的數量\nTime quantum size\nContext switch time\nNumber of processes in ready queue"},{"b":"行程排程谷","t":"複選題","n":6,"q":"多核心處理器的優點是什麼？ What are the advantages of multicore processors?","a":"更快 / They are faster\n消耗更少電力 / They consume less power\n可以利用記憶體停頓來進行多執行緒 / They can leverage memory stalls for multithreading"},{"b":"行程排程谷","t":"複選題","n":7,"q":"Proportional Share Scheduling (比例共享排程) 的特性包含什麼？ What are the characteristics of Proportional Share Scheduling?","a":"將 T 份 CPU 時間分配給所有程序\n每個應用程式接收 N 份，其中 N < T\n確保每個應用程式接收到總處理器時間的 N/T\n這是一種動態優先權演算法\nT shares of CPU time are allocated among all processes\nEach application receives N shares where N < T\nIt ensures each application receives N / T of the total processor time\nIt is a dynamic priority algorithm"},{"b":"行程排程谷","t":"複選題","n":8,"q":"下列哪些是衡量 CPU 排程演算法的準則？ Which of the following are criteria for evaluating CPU scheduling algorithms?","a":"CPU 利用率 / CPU utilization\n吞吐量 / Throughput\n周轉時間 / Turnaround time\n等待時間 / Waiting time"},{"b":"行程排程谷","t":"複選題","n":9,"q":"先到先服務（FCFS）排程的特性是什麼？ What are the characteristics of First-Come, First-Served (FCFS) scheduling?","a":"簡單且易於理解 / Simple and easy to understand\n可能導致「護航效應」 / It can lead to the 'convoy effect'"},{"b":"行程排程谷","t":"複選題","n":10,"q":"多層級回饋佇列（Multilevel Feedback Queue）排程的定義參數包含哪些？ What are the defining parameters of a Multilevel Feedback Queue scheduler?","a":"佇列的數量\n每個佇列的排程演算法\n升級和降級程序的方法\n用於確定行程進入哪個佇列的方法\nThe number of queues\nThe scheduling algorithm for each queue\nThe method used to upgrade and demote a process\nThe method used to determine which queue a process will enter"},{"b":"行程排程谷","t":"複選題","n":11,"q":"分派器（Dispatcher）模組的工作包含哪些項目？ Which of the following tasks are involved in the Dispatcher module?","a":"切換上下文（context switch） / Switching context\n切換到使用者模式 / Switching to user mode\n跳轉到使用者程式中的正確位置以重新啟動該程式 / Jumping to the proper location in the\nuser program to restart that program"},{"b":"行程排程谷","t":"複選題","n":12,"q":"最早截止時間優先排程（Earliest Deadline First Scheduling）的特性是什麼？ What are the characteristics of Earliest Deadline First (EDF) Scheduling?","a":"截止時間越早的優先權越高 / The earlier the deadline, the higher the priority\n截止時間越晚的優先權越低 / The later the deadline, the lower the priority\n是一種動態優先權演算法 / It is a dynamic priority algorithm"},{"b":"行程排程谷","t":"複選題","n":13,"q":"Solaris 作業系統的排程有哪六個類別？ What are the six classes of scheduling in the Solaris operating system?","a":"時程共享（Time sharing）\n互動式（Interactive）\n即時（Real time）\n系統（System）"},{"b":"行程排程谷","t":"複選題","n":14,"q":"即時 CPU 排程面臨哪些挑戰？ What challenges does real-time CPU scheduling face?","a":"軟體實時系統沒有排程保證\n硬即時系統的任務必須在截止時間內完成\n中斷延遲會影響性能\n配置（Dispatch）延遲會影響效能\nSoft real-time systems have no scheduling guarantee\nTasks in hard real-time systems must be completed within their deadline\nInterrupt latency can affect performance\nDispatch latency can affect performance"},{"b":"行程排程谷","t":"複選題","n":15,"q":"在多處理器系統中，下列哪些排程方法屬於負載平衡？ In a multiprocessor system, which of the following scheduling methods are part of load balancing?","a":"推動式遷移（Push migration）\n拉取式遷移（Pull migration）"},{"b":"行程排程谷","t":"複選題","n":16,"q":"在 Solaris 排程中，當多個執行緒具有相同的最高優先權時，排程器會如何處理？ In Solaris scheduling, how does the scheduler handle multiple threads with the same highest priority?","a":"採用迴圈排程 / It uses Round Robin scheduling"},{"b":"行程排程谷","t":"複選題","n":17,"q":"POSIX 即時排程標準中定義了哪些排程類別？ Which scheduling classes are defined in the POSIX real-time scheduling standard?","a":"SCHED_FIFO\nSCHED_RR"},{"b":"行程排程谷","t":"複選題","n":18,"q":"短工作優先（SJF）排程的優點包含哪些？ What are the advantages of Shortest-Job-First (SJF) scheduling?","a":"給定程序集的最小平均等待時間\nMinimum average waiting time for a given set of processes"},{"b":"行程排程谷","t":"複選題","n":19,"q":"下列哪些關於即時排程的敘述是正確的？ Which of the following statements about real-time scheduling are correct?","a":"排程器必須支援搶佔式、基於優先權的排程\n硬即時系統必須提供滿足截止日期的能力\n週期性任務的速率是其週期的倒數\nScheduler must support preemptive, priority-based scheduling\nHard real-time systems must provide deadline satisfaction\nRate of a periodic task is the inverse of its period"},{"b":"行程排程谷","t":"複選題","n":20,"q":"Windows 中，下列哪些是可變（Variable）優先權類別？ In Windows, which of the following are Variable priority classes?","a":"HIGH_PRIORITY_CLASS\nNORMAL_PRIORITY_CLASS\nIDLE_PRIORITY_CLASS"},{"b":"行程排程谷","t":"複選題","n":21,"q":"下列哪些是排程演算法的優化目標？ Which of the following are optimization goals for scheduling algorithms?","a":"最大化 CPU 利用率 / Maximize CPU utilization\n最小化周轉時間 / Minimize turnaround time\n最大化吞吐量 / Maximize throughput\n最小化回應時間 / Minimize response time"},{"b":"行程排程谷","t":"複選題","n":22,"q":"佇列模型（Queueing models）通常用來計算哪些平均值？ What averages are typically computed using queueing models?","a":"平均吞吐量 / Average throughput\n平均利用率 / Average utilization\n平均等待時間 / Average waiting time"},{"b":"行程排程谷","t":"複選題","n":23,"q":"在 Linux 系統中，nice 值如何影響排程？ In the Linux system, how does the nice value affect scheduling?","a":"數值越低代表優先權越高 / A lower value means a higher priority\n-20 的 nice 值對應最高的優先權 / A nice value of -20 corresponds to the highest priority\nnice 值 +19 對應最低優先權 / A nice value of +19 corresponds to the lowest priority"},{"b":"行程排程谷","t":"複選題","n":24,"q":"Windows 中，一個執行緒的優先權會被提升的情況有哪些？ In Windows, under what circumstances is a thread's priority boosted?","a":"當它從等待狀態返回時 / When it const $=id=>document.getElementById(id);
